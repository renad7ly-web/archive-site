<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الأرشيف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mut:#667085;--bd:#e2e6ec;--ac:#1f6feb;--acx:#fff;--bad:#c62828;--badbg:#fdecea;--ok:#2e7d32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#98a2b3;--bd:#2c3440;--ac:#5b9bff;--acx:#0b1220;--bad:#ff8a80;--badbg:#3a1d1d;--ok:#81c784}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#98a2b3;--bd:#2c3440;--ac:#5b9bff;--acx:#0b1220;--bad:#ff8a80;--badbg:#3a1d1d;--ok:#81c784}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{padding:16px;text-align:center}
h1{margin:0;font-size:1.4rem}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px 12px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:0 12px 40px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
input,select,button.b{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
button.b{background:var(--ac);color:var(--acx);border-color:var(--ac);cursor:pointer}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit}
.yr{font-weight:700;margin:14px 0 4px;color:var(--ac)}
.dy{font-size:.85rem;color:var(--mut);margin:8px 0 2px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.f small{color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}
.low{color:var(--bad);font-weight:700}
.alert{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px;margin-bottom:12px}
.empty{color:var(--mut);padding:8px 0}
pre{direction:ltr;text-align:left;overflow-x:auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:.8rem;margin:0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<header><h1>🗂️ نظام الأرشيف</h1></header>
<nav id="nav">
<button data-t="a" class="on">الأرشيف</button>
<button data-t="d">قاعدة البيانات</button>
</nav>
<main>

<section id="a" class="on">
<div class="card"><h2>رفع ملف للأرشيف</h2>
<div class="row">
<input id="at" placeholder="عنوان الملف" maxlength="150">
<input id="ad" type="date">
<input id="af" type="file">
<button class="b" id="aadd">رفع وأرشفة</button>
</div></div>
<div class="card"><h2>البحث والتصفية</h2>
<div class="row">
<input id="aq" placeholder="ابحث بالاسم في كل السنوات…">
<select id="ay"><option value="">كل السنوات</option></select>
</div></div>
<div class="card" id="alist"></div>
</section>

<section id="d">
<div class="card"><h2>مخطط قاعدة البيانات (SQL Dump)</h2>
<pre id="sql"></pre></div>
</section>

</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s||'').replace(/[<>]/g,'').trim().slice(0,150);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
async function api(u,o){let r,j={};try{r=await fetch(u,o);j=await r.json().catch(()=>({}))}catch(e){throw new Error('تعذر الاتصال بالخادم')}if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}
$('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t))};

/* ---------- الأرشيف ---------- */
let files=[];
async function loadFiles(){try{const r=await api('/api/archive');files=r.map(x=>({id:String(x.id),title:x.title,name:x.original_name,date:x.archive_date,year:String(x.year),size:x.file_size}))}catch(e){toast(e.message)}renderA()}
$('ad').value=new Date().toISOString().slice(0,10);
$('aadd').onclick=async()=>{
  const f=$('af').files[0],d=$('ad').value,t=clean($('at').value);
  if(!f||!d)return toast('اختر ملف وتاريخ');
  const fd=new FormData();fd.append('title',t);fd.append('date',d);fd.append('file',f);
  try{await api('/api/archive',{method:'POST',body:fd});$('af').value='';$('at').value='';toast('تمت الأرشفة ✓');loadFiles()}catch(e){toast(e.message)}
};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function renderA(){
  const q=$('aq').value.trim().toLowerCase(),y=$('ay').value;
  const years=[...new Set(files.map(f=>f.year))].sort().reverse();
  $('ay').innerHTML='<option value="">كل السنوات</option>'+years.map(v=>`<option ${v===y?'selected':''}>${esc(v)}</option>`).join('');
  const list=files.filter(f=>(!y||f.year===y)&&(!q||(f.title+' '+f.name).toLowerCase().includes(q)));
  if(!list.length){$('alist').innerHTML='<div class="empty">لا توجد ملفات.</div>';return}
  let h='';
  [...new Set(list.map(f=>f.year))].sort().reverse().forEach(yr=>{
    h+=`<div class="yr">📁 ${esc(yr)}</div>`;
    const ys=list.filter(f=>f.year===yr);
    [...new Set(ys.map(f=>f.date))].sort().reverse().forEach(dt=>{
      h+=`<div class="dy">${esc(dt)}</div>`;
      ys.filter(f=>f.date===dt).forEach(f=>{h+=`<div class="f"><div>${esc(f.title)}<br><small>${esc(f.name)} · ${kb(f.size)}</small></div><div><button class="s" data-o="${esc(f.id)}">فتح</button> <button class="s" data-x="${esc(f.id)}">حذف</button></div></div>`});
    });
  });
  $('alist').innerHTML=h;
}
$('aq').oninput=renderA;$('ay').onchange=renderA;
$('alist').onclick=async e=>{
  const o=e.target.dataset.o,x=e.target.dataset.x;
  if(o)window.open('/api/archive/'+encodeURIComponent(o)+'/download','_blank');
  if(x&&confirm('حذف الملف من الأرشيف؟')){try{await api('/api/archive/'+encodeURIComponent(x),{method:'DELETE'});loadFiles()}catch(er){toast(er.message)}}
};

fetch('/schema.sql').then(r=>r.text()).then(t=>{$('sql').textContent=t}).catch(()=>{});
loadFiles();
</script>
</body>
</html>
